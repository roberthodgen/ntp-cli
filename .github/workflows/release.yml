name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            printf '::error::Tag %s must use SemVer format like v1.2.3 or v1.2.3-preview.1\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ntp-cli.sln

      - name: Build
        run: dotnet build ntp-cli.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test ntp-cli.sln -c Release --no-build

      - name: Pack client package
        run: dotnet pack src/Client/RobertHodgen.Ntp.Client.csproj -c Release -o artifacts --no-build /p:PackageVersion=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Build CLI artifacts
        run: make ntpc

      - name: Stage CLI artifacts
        run: cp ntpc_win-x64.exe ntpc_linux-x64 ntpc_macos-x64 ntpc_macos-arm64 artifacts/

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push artifacts/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
