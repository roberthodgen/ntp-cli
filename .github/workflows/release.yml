name: 🚀 Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 NuGet Restore
        run: dotnet restore ntp-cli.sln

      - name: 🧪 Test
        run: dotnet test ntp-cli.sln -c Release

      - name: 🏗️ Build packages and non-macOS binaries
        run: make package ntpc-non-macos

      - name: ⬆️ Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/*.nupkg
            build/*.snupkg
          if-no-files-found: error

      - name: ⬆️ Upload non-macOS CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-non-macos
          path: |
            build/ntpc_win-x64.exe
            build/ntpc_linux-x64
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    environment: release

    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 NuGet Restore
        run: dotnet restore ntp-cli.sln

      - name: 🏗️ Build macOS binaries
        run: make ntpc-macos

      - name: 🔐 Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: ✍️ Sign macOS binaries
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime --sign "$APPLE_CODESIGN_IDENTITY" build/ntpc_macos-x64
          codesign --force --timestamp --options runtime --sign "$APPLE_CODESIGN_IDENTITY" build/ntpc_macos-arm64
          codesign --verify --strict --verbose=2 build/ntpc_macos-x64
          codesign --verify --strict --verbose=2 build/ntpc_macos-arm64

      - name: 🗜️ Zip signed macOS binaries
        run: |
          ditto -c -k --keepParent build/ntpc_macos-x64 build/ntpc_macos-x64.zip
          ditto -c -k --keepParent build/ntpc_macos-arm64 build/ntpc_macos-arm64.zip

      - name: 🧾 Notarize macOS zips
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit build/ntpc_macos-x64.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun notarytool submit build/ntpc_macos-arm64.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait

      - name: ⬆️ Upload notarized macOS CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: |
            build/ntpc_macos-x64.zip
            build/ntpc_macos-arm64.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - macos
    environment: release

    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@v4

      - name: ⬇️ Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: 🔐 NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: roberthodgen

      - name: 🚀 Push Package to NuGet
        run: dotnet nuget push build/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: 🧭 Push Symbols to NuGet
        run: dotnet nuget push build/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: 📝 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/* --generate-notes --title "$GITHUB_REF_NAME"
