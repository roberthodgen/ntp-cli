name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ntp-cli.sln

      - name: Build
        run: dotnet build ntp-cli.sln -c Release --no-restore

      - name: Test
        run: dotnet test ntp-cli.sln -c Release --no-build

      - name: Pack client package
        run: dotnet pack src/Client/RobertHodgen.Ntp.Client.csproj -c Release -o artifacts /p:PackageVersion=0.0.0-ci

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
