name: ✅ .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 NuGet Restore
        run: dotnet restore ntp-cli.sln

      - name: ✅ Test
        run: dotnet test ntp-cli.sln --no-build --verbosity normal

      - name: 🛠 Build
        run: make
